<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinBot – Sign In | Your Financial Command Center</title>
  <meta name="description" content="Sign in or create your FinBot account to start tracking your personal finances with AI-powered insights." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ── Reset & Tokens ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep:       #070b14;
      --bg-mid:        #0d1526;
      --surface:       rgba(255,255,255,0.05);
      --surface-hover: rgba(255,255,255,0.09);
      --border:        rgba(255,255,255,0.10);
      --border-focus:  rgba(99,179,237,0.60);
      --accent:        #4f8ef7;
      --accent-2:      #7c5cfc;
      --accent-glow:   rgba(79,142,247,0.35);
      --success:       #22c55e;
      --warning:       #f59e0b;
      --danger:        #ef4444;
      --text-primary:  #f0f4ff;
      --text-muted:    #8899b4;
      --text-dim:      #4a5a7a;
      --radius:        14px;
      --radius-sm:     8px;
      --transition:    0.25s cubic-bezier(0.4,0,0.2,1);
    }

    html, body {
      height: 100%;
      font-family: 'Inter', sans-serif;
      background: var(--bg-deep);
      color: var(--text-primary);
      overflow-x: hidden;
    }

    /* ── Animated Background ────────────────────────────────────────────── */
    .bg-canvas {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(79,142,247,0.15) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 90%, rgba(124,92,252,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 60% 40%, rgba(34,197,94,0.05) 0%, transparent 60%),
        linear-gradient(180deg, #070b14 0%, #0d1526 100%);
      animation: bgPulse 10s ease-in-out infinite alternate;
    }
    @keyframes bgPulse {
      from { opacity: 0.9; }
      to   { opacity: 1; }
    }

    /* ── Floating Orbs ──────────────────────────────────────────────────── */
    .orb {
      position: fixed; border-radius: 50%;
      filter: blur(80px); pointer-events: none; z-index: 0;
      animation: orbFloat linear infinite;
    }
    .orb-1 {
      width: 350px; height: 350px; top: -80px; left: -100px;
      background: radial-gradient(circle, rgba(79,142,247,0.18), transparent 70%);
      animation-duration: 18s;
    }
    .orb-2 {
      width: 280px; height: 280px; bottom: -60px; right: -80px;
      background: radial-gradient(circle, rgba(124,92,252,0.15), transparent 70%);
      animation-duration: 22s; animation-direction: reverse;
    }
    .orb-3 {
      width: 200px; height: 200px; top: 50%; left: 60%;
      background: radial-gradient(circle, rgba(34,197,94,0.08), transparent 70%);
      animation-duration: 15s;
    }
    @keyframes orbFloat {
      0%  { transform: translate(0,0) scale(1); }
      33% { transform: translate(30px,-20px) scale(1.05); }
      66% { transform: translate(-15px,25px) scale(0.97); }
      100%{ transform: translate(0,0) scale(1); }
    }

    /* ── Grid lines ─────────────────────────────────────────────────────── */
    .bg-grid {
      position: fixed; inset: 0; z-index: 0; opacity: 0.03;
      background-image:
        linear-gradient(rgba(255,255,255,0.5) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.5) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    /* ── Page Layout ────────────────────────────────────────────────────── */
    .page {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }

    /* ── Logo / Brand ───────────────────────────────────────────────────── */
    .brand {
      text-align: center; margin-bottom: 28px;
    }
    .brand-icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 64px; height: 64px; border-radius: 18px; margin-bottom: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 8px 32px var(--accent-glow);
      animation: iconPop 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes iconPop {
      from { transform: scale(0.5) rotate(-10deg); opacity: 0; }
      to   { transform: scale(1)   rotate(0deg);   opacity: 1; }
    }
    .brand-icon svg { width: 32px; height: 32px; fill: #fff; }
    .brand-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 28px; font-weight: 700; letter-spacing: -0.5px;
      background: linear-gradient(135deg, #fff 0%, #a0b4ff 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .brand-tagline {
      font-size: 13px; color: var(--text-muted); margin-top: 4px;
      letter-spacing: 0.3px;
    }

    /* ── Card ───────────────────────────────────────────────────────────── */
    .card {
      width: 100%; max-width: 460px;
      background: rgba(13,21,38,0.80);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.07) inset;
      animation: cardIn 0.5s cubic-bezier(0.34,1.3,0.64,1) 0.1s both;
    }
    @keyframes cardIn {
      from { transform: translateY(40px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    /* ── Tabs ───────────────────────────────────────────────────────────── */
    .tabs {
      display: grid; grid-template-columns: 1fr 1fr;
      background: rgba(255,255,255,0.04);
      border-radius: var(--radius-sm); padding: 4px;
      margin-bottom: 28px; gap: 2px;
    }
    .tab-btn {
      padding: 10px; border: none; background: transparent;
      border-radius: calc(var(--radius-sm) - 2px);
      font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500;
      color: var(--text-muted); cursor: pointer;
      transition: all var(--transition);
    }
    .tab-btn.active {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      box-shadow: 0 4px 16px var(--accent-glow);
    }
    .tab-btn:not(.active):hover { color: var(--text-primary); }

    /* ── Form panels ────────────────────────────────────────────────────── */
    .panel { display: none; }
    .panel.active {
      display: block;
      animation: fadeUp 0.3s cubic-bezier(0.4,0,0.2,1) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Form elements ──────────────────────────────────────────────────── */
    .form-group { margin-bottom: 16px; }

    label {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.7px;
      margin-bottom: 6px;
    }
    label .lbl-badge {
      font-size: 10px; padding: 1px 6px; border-radius: 20px;
      background: rgba(79,142,247,0.15); color: var(--accent);
      text-transform: none; letter-spacing: 0; font-weight: 500;
    }

    .input-wrap { position: relative; }
    .input-wrap .input-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      width: 18px; height: 18px; color: var(--text-dim);
      pointer-events: none; transition: color var(--transition);
    }
    .input-wrap .input-status {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      width: 18px; height: 18px; display: flex; align-items: center; justify-content: center;
    }

    input[type="text"], input[type="email"], input[type="password"] {
      width: 100%; padding: 12px 44px 12px 44px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm); outline: none;
      font-family: 'Inter', sans-serif; font-size: 15px;
      color: var(--text-primary);
      transition: all var(--transition);
    }
    input:focus {
      border-color: var(--border-focus);
      background: rgba(255,255,255,0.08);
      box-shadow: 0 0 0 3px rgba(99,179,237,0.12);
    }
    input.valid { border-color: rgba(34,197,94,0.5); }
    input.error { border-color: rgba(239,68,68,0.6); }
    input:focus + .input-icon,
    .input-wrap:focus-within .input-icon { color: var(--accent); }

    .field-msg {
      font-size: 11.5px; margin-top: 5px; min-height: 16px;
      display: flex; align-items: center; gap: 4px;
      transition: all var(--transition);
    }
    .field-msg.err  { color: var(--danger); }
    .field-msg.ok   { color: var(--success); }
    .field-msg.info { color: var(--text-muted); }

    /* toggle password visibility */
    .pwd-toggle {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--text-dim); padding: 0; display: flex;
      transition: color var(--transition);
    }
    .pwd-toggle:hover { color: var(--text-muted); }

    /* ── Password Strength ──────────────────────────────────────────────── */
    .strength-wrap { margin-top: 10px; }
    .strength-bar-track {
      height: 5px; border-radius: 99px;
      background: rgba(255,255,255,0.07);
      overflow: hidden;
    }
    .strength-bar-fill {
      height: 100%; border-radius: 99px;
      width: 0; transition: width 0.4s cubic-bezier(0.4,0,0.2,1), background 0.4s ease;
    }
    .strength-meta {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 6px;
    }
    .strength-label {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.6px; color: var(--text-dim);
      transition: color var(--transition);
    }
    .strength-rules {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 4px 16px; margin-top: 8px;
    }
    .rule {
      display: flex; align-items: center; gap: 5px;
      font-size: 11px; color: var(--text-dim);
      transition: color var(--transition);
    }
    .rule svg { width: 12px; height: 12px; flex-shrink: 0; }
    .rule.met { color: var(--success); }

    /* Strength colors */
    .s-weak    { width: 20%; background: var(--danger); }
    .s-fair    { width: 50%; background: var(--warning); }
    .s-strong  { width: 75%; background: #3b82f6; }
    .s-vstrong { width: 100%;background: var(--success); }

    /* ── Username counter ───────────────────────────────────────────────── */
    .char-count {
      font-size: 11px; color: var(--text-dim);
      position: absolute; right: 36px; top: 50%; transform: translateY(-50%);
    }
    .char-count.warn { color: var(--warning); }
    .char-count.over { color: var(--danger); }

    /* ── Submit button ──────────────────────────────────────────────────── */
    .btn-primary {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      border: none; border-radius: var(--radius-sm);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px; font-weight: 600; color: #fff; cursor: pointer;
      letter-spacing: 0.3px;
      box-shadow: 0 6px 24px var(--accent-glow);
      transition: all var(--transition);
      position: relative; overflow: hidden;
      margin-top: 8px;
    }
    .btn-primary::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
      opacity: 0; transition: opacity var(--transition);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 32px var(--accent-glow); }
    .btn-primary:hover::before { opacity: 1; }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled {
      opacity: 0.5; cursor: not-allowed;
      transform: none; box-shadow: none;
    }

    /* ── Loading spinner ────────────────────────────────────────────────── */
    .spinner {
      display: inline-block; width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff; border-radius: 50%;
      animation: spin 0.7s linear infinite; vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Divider ────────────────────────────────────────────────────────── */
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0; color: var(--text-dim); font-size: 12px;
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 1px;
      background: var(--border);
    }

    /* ── Alert banner ───────────────────────────────────────────────────── */
    .alert {
      padding: 12px 16px; border-radius: var(--radius-sm);
      font-size: 13px; line-height: 1.5;
      display: none; align-items: flex-start; gap: 10px;
      margin-bottom: 16px;
      animation: alertIn 0.3s ease both;
    }
    @keyframes alertIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .alert.visible { display: flex; }
    .alert-err  { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.25); color: #fca5a5; }
    .alert-ok   { background: rgba(34,197,94,0.12);  border: 1px solid rgba(34,197,94,0.25);  color: #86efac; }

    /* ── Footer text ────────────────────────────────────────────────────── */
    .footer-note {
      text-align: center; font-size: 12px; color: var(--text-dim);
      margin-top: 20px;
    }
    .footer-note a { color: var(--accent); text-decoration: none; }
    .footer-note a:hover { text-decoration: underline; }

    /* ── Status icon ────────────────────────────────────────────────────── */
    .status-icon { width: 16px; height: 16px; }

    /* ── Responsive ─────────────────────────────────────────────────────── */
    @media (max-width: 500px) {
      .card { padding: 24px 20px; border-radius: 18px; }
    }
  </style>
</head>

<body>
  <div class="bg-canvas"></div>
  <div class="bg-grid"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="page">
    <div style="width:100%; max-width:460px;">

      <!-- Brand -->
      <div class="brand">
        <div class="brand-icon">
          <!-- Chart / Finance icon -->
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 3v18h18M7 16l4-4 3 3 5-5" stroke="#fff" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          </svg>
        </div>
        <div class="brand-name">FinBot</div>
        <div class="brand-tagline">Your AI-powered financial command center</div>
      </div>

      <!-- Card -->
      <div class="card">

        <!-- Tabs -->
        <div class="tabs" role="tablist">
          <button class="tab-btn active" id="tab-login" role="tab"
            aria-selected="true" aria-controls="panel-login"
            onclick="switchTab('login')">Sign In</button>
          <button class="tab-btn" id="tab-register" role="tab"
            aria-selected="false" aria-controls="panel-register"
            onclick="switchTab('register')">Create Account</button>
        </div>

        <!-- ── LOGIN Panel ── -->
        <div class="panel active" id="panel-login" role="tabpanel">
          <div class="alert alert-err" id="login-alert" role="alert"></div>

          <form id="login-form" novalidate>

            <div class="form-group">
              <label for="login-email">Email Address</label>
              <div class="input-wrap">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="4" width="20" height="16" rx="2"/>
                  <path d="m22 7-10 7L2 7"/>
                </svg>
                <input type="email" id="login-email" name="email"
                  placeholder="you@example.com" autocomplete="email" />
              </div>
              <div class="field-msg" id="login-email-msg"></div>
            </div>

            <div class="form-group">
              <label for="login-password">Password</label>
              <div class="input-wrap">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <input type="password" id="login-password" name="password"
                  placeholder="Your password" autocomplete="current-password" />
                <button type="button" class="pwd-toggle" onclick="togglePwd('login-password', this)"
                  aria-label="Toggle password visibility">
                  <svg id="eye-login" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                </button>
              </div>
              <div class="field-msg" id="login-pwd-msg"></div>
            </div>

            <button class="btn-primary" type="submit" id="login-btn">Sign In</button>
          </form>

          <p class="footer-note" style="margin-top:16px;">
            Don't have an account?
            <a href="#" onclick="switchTab('register');return false;">Create one free →</a>
          </p>
        </div>

        <!-- ── REGISTER Panel ── -->
        <div class="panel" id="panel-register" role="tabpanel">
          <div class="alert alert-err" id="reg-alert" role="alert"></div>

          <form id="reg-form" novalidate>

            <!-- Username -->
            <div class="form-group">
              <label for="reg-username">
                Username
                <span class="lbl-badge">max 10 chars</span>
              </label>
              <div class="input-wrap">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="8" r="4"/>
                  <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                </svg>
                <input type="text" id="reg-username" name="username"
                  placeholder="e.g. joesmith" maxlength="10"
                  autocomplete="username" oninput="onUsernameInput(this)" />
                <span class="char-count" id="uname-count">0/10</span>
              </div>
              <div class="field-msg" id="uname-msg"></div>
            </div>

            <!-- Email -->
            <div class="form-group">
              <label for="reg-email">Email Address</label>
              <div class="input-wrap">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="4" width="20" height="16" rx="2"/>
                  <path d="m22 7-10 7L2 7"/>
                </svg>
                <input type="email" id="reg-email" name="email"
                  placeholder="you@example.com" autocomplete="email"
                  oninput="onEmailInput(this)" />
                <div class="input-status" id="email-status"></div>
              </div>
              <div class="field-msg" id="email-msg"></div>
            </div>

            <!-- Password -->
            <div class="form-group">
              <label for="reg-password">Password</label>
              <div class="input-wrap">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="11" width="18" height="11" rx="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <input type="password" id="reg-password" name="password"
                  placeholder="Create a strong password"
                  autocomplete="new-password" oninput="onPasswordInput(this)" />
                <button type="button" class="pwd-toggle" onclick="togglePwd('reg-password', this)"
                  aria-label="Toggle password visibility">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                </button>
              </div>

              <!-- Strength meter -->
              <div class="strength-wrap" id="strength-wrap" style="display:none;">
                <div class="strength-bar-track">
                  <div class="strength-bar-fill" id="strength-bar"></div>
                </div>
                <div class="strength-meta">
                  <span class="strength-label" id="strength-label">Enter password</span>
                </div>
                <div class="strength-rules" id="strength-rules">
                  <div class="rule" id="r-len">
                    <svg viewBox="0 0 12 12" fill="currentColor"><circle cx="6" cy="6" r="5" opacity="0.3"/></svg>
                    8+ characters
                  </div>
                  <div class="rule" id="r-upper">
                    <svg viewBox="0 0 12 12" fill="currentColor"><circle cx="6" cy="6" r="5" opacity="0.3"/></svg>
                    Uppercase letter
                  </div>
                  <div class="rule" id="r-num">
                    <svg viewBox="0 0 12 12" fill="currentColor"><circle cx="6" cy="6" r="5" opacity="0.3"/></svg>
                    Number
                  </div>
                  <div class="rule" id="r-special">
                    <svg viewBox="0 0 12 12" fill="currentColor"><circle cx="6" cy="6" r="5" opacity="0.3"/></svg>
                    Special character
                  </div>
                </div>
              </div>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
              <label for="reg-confirm">Confirm Password</label>
              <div class="input-wrap">
                <svg class="input-icon" viewBox="0 0 24 24" fill="none"
                  stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 12l2 2 4-4"/>
                  <rect x="3" y="11" width="18" height="11" rx="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
                <input type="password" id="reg-confirm" name="confirm"
                  placeholder="Re-enter your password"
                  autocomplete="new-password" oninput="onConfirmInput(this)" />
                <button type="button" class="pwd-toggle" onclick="togglePwd('reg-confirm', this)"
                  aria-label="Toggle confirm password visibility">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                </button>
              </div>
              <div class="field-msg" id="confirm-msg"></div>
            </div>

            <button class="btn-primary" type="submit" id="reg-btn">Create Account</button>
          </form>

          <p class="footer-note" style="margin-top:16px;">
            Already have an account?
            <a href="#" onclick="switchTab('login');return false;">Sign in →</a>
          </p>
        </div>

      </div><!-- /card -->

      <p class="footer-note" style="margin-top:16px;">
        &copy; 2026 FinBot · AI-Powered Finance Tracker
      </p>
    </div>
  </div>

  <!-- ── SVG icons (check / cross / spinner) ──────────────────────────────── -->
  <svg style="display:none" id="icon-defs">
    <symbol id="ico-check" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </symbol>
    <symbol id="ico-x" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
    </symbol>
    <symbol id="ico-loader" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2.5" stroke-linecap="round">
      <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83">
        <animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="0.8s" repeatCount="indefinite"/>
      </path>
    </symbol>
  </svg>

  <script>
    /* ── Utilities ─────────────────────────────────────────────────────────── */
    const $ = id => document.getElementById(id);

    function setMsg(id, text, type /* 'ok'|'err'|'info' */) {
      const el = $(id);
      el.textContent = text;
      el.className   = `field-msg ${type}`;
    }
    function clearMsg(id) {
      const el = $(id);
      el.textContent = '';
      el.className   = 'field-msg';
    }
    function setInputState(inputEl, state /* 'ok'|'error'|'' */) {
      inputEl.className = state;
    }

    function showAlert(id, msg) {
      const el = $(id);
      el.textContent = msg;
      el.className = 'alert alert-err visible';
    }
    function hideAlert(id) { $(id).className = 'alert alert-err'; }

    function svgIcon(id, color) {
      return `<svg width="16" height="16" style="color:${color}"><use href="#${id}"/></svg>`;
    }

    /* ── Tab switching ─────────────────────────────────────────────────────── */
    function switchTab(tab) {
      ['login','register'].forEach(t => {
        $(`tab-${t}`).classList.toggle('active', t === tab);
        $(`tab-${t}`).setAttribute('aria-selected', t === tab);
        $(`panel-${t}`).classList.toggle('active', t === tab);
      });
      hideAlert('login-alert');
      hideAlert('reg-alert');
    }

    /* ── Password visibility toggle ────────────────────────────────────────── */
    function togglePwd(inputId, btn) {
      const inp = $(inputId);
      const isText = inp.type === 'text';
      inp.type = isText ? 'password' : 'text';
      btn.querySelector('svg').style.opacity = isText ? '1' : '0.45';
    }

    /* ── Password strength ─────────────────────────────────────────────────── */
    const rules = [
      { id: 'r-len',     test: p => p.length >= 8,                label: '8+ characters' },
      { id: 'r-upper',   test: p => /[A-Z]/.test(p),              label: 'Uppercase letter' },
      { id: 'r-num',     test: p => /[0-9]/.test(p),              label: 'Number' },
      { id: 'r-special', test: p => /[^A-Za-z0-9]/.test(p),       label: 'Special character' },
    ];

    const strengthConfig = [
      { label: 'Weak',      cls: 's-weak',    color: '#ef4444' },
      { label: 'Fair',      cls: 's-fair',    color: '#f59e0b' },
      { label: 'Strong',    cls: 's-strong',  color: '#3b82f6' },
      { label: 'Very Strong', cls: 's-vstrong', color: '#22c55e' },
    ];

    const checkIcon  = `<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="2 6 5 9 10 3"/></svg>`;
    const circleIcon = `<svg viewBox="0 0 12 12" fill="currentColor"><circle cx="6" cy="6" r="5" opacity="0.25"/></svg>`;

    function calcStrength(pwd) {
      return rules.filter(r => r.test(pwd)).length;
    }

    function updateStrengthUI(pwd) {
      const wrap = $('strength-wrap');
      if (!pwd) { wrap.style.display = 'none'; return; }
      wrap.style.display = 'block';

      const score = calcStrength(pwd) - 1; // 0-3
      const cfg   = strengthConfig[Math.max(0, score)];
      const bar   = $('strength-bar');
      bar.className = `strength-bar-fill ${cfg.cls}`;
      $('strength-label').textContent  = cfg.label;
      $('strength-label').style.color  = cfg.color;

      rules.forEach(r => {
        const el  = $(r.id);
        const met = r.test(pwd);
        el.classList.toggle('met', met);
        el.querySelector('svg').outerHTML; // re-read
        el.innerHTML = `${met ? checkIcon : circleIcon} ${r.label}`;
        el.classList.toggle('met', met);
      });
    }

    /* ── Username debounce check ────────────────────────────────────────────── */
    let unameTimer;
    function onUsernameInput(inp) {
      const val = inp.value;
      const count = $('uname-count');
      count.textContent = `${val.length}/10`;
      count.className   = val.length > 8 ? (val.length > 10 ? 'char-count over' : 'char-count warn') : 'char-count';

      if (!val) { setInputState(inp, ''); clearMsg('uname-msg'); return; }
      if (val.length > 10) {
        setInputState(inp, 'error');
        setMsg('uname-msg', 'Maximum 10 characters allowed', 'err');
        return;
      }

      clearTimeout(unameTimer);
      setMsg('uname-msg', '⏳ Checking availability…', 'info');
      unameTimer = setTimeout(async () => {
        try {
          const res  = await fetch('/api/check-username', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ username: val })
          });
          const data = await res.json();
          if (data.available) {
            setInputState(inp, 'valid');
            setMsg('uname-msg', '✓ Username is available', 'ok');
          } else {
            setInputState(inp, 'error');
            setMsg('uname-msg', '✗ This username is already taken', 'err');
          }
        } catch { clearMsg('uname-msg'); }
      }, 500);
    }

    /* ── Email debounce check ──────────────────────────────────────────────── */
    let emailTimer;
    function onEmailInput(inp) {
      clearTimeout(emailTimer);
      const val = inp.value;
      if (!val) { setInputState(inp, ''); clearMsg('email-msg'); return; }

      emailTimer = setTimeout(async () => {
        const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);
        if (!valid) {
          setInputState(inp, 'error');
          setMsg('email-msg', 'Please enter a valid email address', 'err');
          return;
        }
        setMsg('email-msg', '⏳ Checking…', 'info');
        try {
          const res  = await fetch('/api/check-email', {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ email: val })
          });
          const data = await res.json();
          if (data.available) {
            setInputState(inp, 'valid');
            setMsg('email-msg', '✓ Email is available', 'ok');
          } else {
            setInputState(inp, 'error');
            setMsg('email-msg', '✗ This email is already registered', 'err');
          }
        } catch { clearMsg('email-msg'); }
      }, 600);
    }

    /* ── Password input handler ────────────────────────────────────────────── */
    function onPasswordInput(inp) {
      updateStrengthUI(inp.value);
      // re-validate confirm if it has content
      const confirm = $('reg-confirm');
      if (confirm.value) onConfirmInput(confirm);
    }

    /* ── Confirm password handler ──────────────────────────────────────────── */
    function onConfirmInput(inp) {
      const pwd = $('reg-password').value;
      if (!inp.value) { setInputState(inp, ''); clearMsg('confirm-msg'); return; }
      if (inp.value === pwd) {
        setInputState(inp, 'valid');
        setMsg('confirm-msg', '✓ Passwords match', 'ok');
      } else {
        setInputState(inp, 'error');
        setMsg('confirm-msg', '✗ Passwords do not match', 'err');
      }
    }

    /* ── Login form ────────────────────────────────────────────────────────── */
    $('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      hideAlert('login-alert');

      const email    = $('login-email').value.trim();
      const password = $('login-password').value;

      if (!email) {
        setInputState($('login-email'), 'error');
        setMsg('login-email-msg', 'Email is required', 'err');
        return;
      }
      if (!password) {
        setInputState($('login-password'), 'error');
        setMsg('login-pwd-msg', 'Password is required', 'err');
        return;
      }

      const btn = $('login-btn');
      btn.disabled   = true;
      btn.innerHTML  = '<span class="spinner"></span> Signing in…';

      try {
        const res  = await fetch('/api/login', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok) {
          btn.innerHTML = '✓ Success! Redirecting…';
          setTimeout(() => { window.location.href = '/app'; }, 600);
        } else {
          btn.disabled  = false;
          btn.innerHTML = 'Sign In';
          showAlert('login-alert', data.error || 'Login failed. Please try again.');
        }
      } catch {
        btn.disabled  = false;
        btn.innerHTML = 'Sign In';
        showAlert('login-alert', 'Network error. Please check your connection.');
      }
    });

    /* ── Register form ─────────────────────────────────────────────────────── */
    $('reg-form').addEventListener('submit', async e => {
      e.preventDefault();
      hideAlert('reg-alert');

      const username = $('reg-username').value.trim();
      const email    = $('reg-email').value.trim();
      const password = $('reg-password').value;
      const confirm  = $('reg-confirm').value;

      // Client-side guard
      let hasErr = false;
      if (!username) {
        setInputState($('reg-username'), 'error');
        setMsg('uname-msg', 'Username is required', 'err');
        hasErr = true;
      } else if (username.length > 10) {
        setInputState($('reg-username'), 'error');
        setMsg('uname-msg', 'Max 10 characters', 'err');
        hasErr = true;
      }
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        setInputState($('reg-email'), 'error');
        setMsg('email-msg', 'Valid email is required', 'err');
        hasErr = true;
      }
      if (calcStrength(password) < 2) {
        showAlert('reg-alert', 'Please create a stronger password (at least Fair strength).');
        hasErr = true;
      }
      if (password !== confirm) {
        setInputState($('reg-confirm'), 'error');
        setMsg('confirm-msg', 'Passwords do not match', 'err');
        hasErr = true;
      }
      if (hasErr) return;

      const btn = $('reg-btn');
      btn.disabled  = true;
      btn.innerHTML = '<span class="spinner"></span> Creating account…';

      try {
        const res  = await fetch('/api/register', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ username, email, password })
        });
        const data = await res.json();
        if (res.ok) {
          btn.innerHTML = '✓ Account created! Redirecting…';
          setTimeout(() => { window.location.href = '/app'; }, 700);
        } else {
          btn.disabled  = false;
          btn.innerHTML = 'Create Account';
          if (data.details) {
            Object.entries(data.details).forEach(([field, msg]) => {
              if (field === 'username') {
                setInputState($('reg-username'), 'error'); setMsg('uname-msg', msg, 'err');
              } else if (field === 'email') {
                setInputState($('reg-email'), 'error'); setMsg('email-msg', msg, 'err');
              } else if (field === 'password') {
                showAlert('reg-alert', msg);
              }
            });
          } else {
            showAlert('reg-alert', data.error || 'Registration failed. Please try again.');
          }
        }
      } catch {
        btn.disabled  = false;
        btn.innerHTML = 'Create Account';
        showAlert('reg-alert', 'Network error. Please check your connection.');
      }
    });
  </script>
</body>
</html>
