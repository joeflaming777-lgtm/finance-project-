<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinBot – Financial Calendar</title>
  <meta name="description" content="Your personal financial calendar. Track income and expenses day by day." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    (function() {
      if (localStorage.getItem('finbot_theme') === 'light') {
        document.documentElement.classList.add('light-mode');
      }
    })();
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #070b14;
      --surface:     #0d1526;
      --surface-2:   #111d35;
      --surface-3:   rgba(255,255,255,0.04);
      --border:      rgba(255,255,255,0.09);
      --accent:      #4f8ef7;
      --accent-2:    #7c5cfc;
      --income:      #22c55e;
      --income-bg:   rgba(34,197,94,0.12);
      --expense:     #ef4444;
      --expense-bg:  rgba(239,68,68,0.12);
      --note:        #f59e0b;
      --note-bg:     rgba(245,158,11,0.12);
      --text-1:      #f0f4ff;
      --text-2:      #8899b4;
      --text-3:      #4a5a7a;
      --radius:      12px;
      --t:           0.22s cubic-bezier(0.4,0,0.2,1);
    }

    /* ── Light Mode (Day Mood) Overrides ── */
    html.light-mode, body.light-mode {
      --bg:          #f4f7fb;
      --surface:     #ffffff;
      --surface-2:   #f0f4f9;
      --surface-3:   rgba(0,0,0,0.04);
      --border:      #d1d5db;
      --accent:      #2563eb;
      --accent-2:    #7c3aed;
      --income:      #059669;
      --income-bg:   rgba(5,150,105,0.12);
      --expense:     #dc2626;
      --expense-bg:  rgba(220,38,38,0.12);
      --note:        #d97706;
      --note-bg:     rgba(217,119,6,0.12);
      --text-1:      #0f172a;
      --text-2:      #334155;
      --text-3:      #64748b;
      background-color: var(--bg);
      color: var(--text-1);
    }

    html.light-mode body::before {
      background:
        radial-gradient(ellipse 70% 50% at 10% 0%, rgba(37,99,235,.08) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 90% 100%, rgba(124,58,237,.06) 0%, transparent 60%);
    }

    html.light-mode nav {
      background: rgba(255, 255, 255, 0.88);
      border-bottom-color: #cbd5e1;
    }

    html.light-mode .nav-brand {
      background: linear-gradient(135deg, #0f172a 0%, #2563eb 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    html.light-mode .summary-card,
    html.light-mode .cal-grid-wrap {
      background: rgba(255, 255, 255, 0.9);
      border-color: #e2e8f0;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }

    html.light-mode .day-cell {
      background: rgba(248, 250, 252, 0.8);
      border-color: #e2e8f0;
      color: #0f172a;
    }

    html.light-mode .day-cell.other-month {
      background: #f1f5f9;
      opacity: 0.6;
    }

    html.light-mode .day-cell.today {
      background: #eff6ff;
      border-color: #3b82f6;
    }

    html.light-mode .modal-card {
      background: #ffffff;
      border-color: #e2e8f0;
      box-shadow: 0 20px 40px rgba(0,0,0,0.12);
    }

    html.light-mode input,
    html.light-mode select,
    html.light-mode textarea {
      background: #f8fafc;
      color: #0f172a;
      border-color: #cbd5e1;
    }

    html.light-mode .btn-ghost {
      background: #f1f5f9;
      color: #334155;
      border-color: #cbd5e1;
    }

    html.light-mode .btn-ghost:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    html, body { height: 100%; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-1); }

    /* ── Gradient bg ── */
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 70% 50% at 10% 0%,   rgba(79,142,247,.12) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 90% 100%,  rgba(124,92,252,.10) 0%, transparent 60%);
    }

    /* ── Layout ── */
    #app { position: relative; z-index: 1; display: flex; flex-direction: column; min-height: 100vh; }

    /* ── Top Nav ── */
    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 28px;
      background: rgba(13,21,38,0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 100;
    }
    .nav-brand {
      display: flex; align-items: center; gap: 10px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 20px; font-weight: 700;
      background: linear-gradient(135deg, #fff 0%, #a0b4ff 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-decoration: none;
    }
    .nav-brand .brand-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 8px var(--accent);
    }
    .nav-links { display: flex; align-items: center; gap: 10px; }
    .nav-user {
      font-size: 13px; color: var(--text-2); padding: 6px 14px;
      background: var(--surface-3); border: 1px solid var(--border);
      border-radius: 20px; display: flex; align-items: center; gap: 6px;
    }
    .nav-user .user-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--income); box-shadow: 0 0 6px var(--income);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .btn-nav {
      padding: 7px 16px; border-radius: 8px; border: none;
      font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500;
      cursor: pointer; transition: all var(--t); text-decoration: none;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-ghost {
      background: var(--surface-3); color: var(--text-2);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.08); color: var(--text-1); }
    .btn-accent {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
    }
    .btn-accent:hover { opacity: 0.9; transform: translateY(-1px); }

    /* ── Main wrapper ── */
    main { flex: 1; padding: 28px; max-width: 1100px; margin: 0 auto; width: 100%; }

    /* ── Month Summary Cards ── */
    .summary-row {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px;
      margin-bottom: 24px;
    }
    .summary-card {
      background: rgba(13,21,38,0.7);
      border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px 20px;
      backdrop-filter: blur(12px);
      display: flex; flex-direction: column; gap: 4px;
      transition: border-color var(--t);
    }
    .summary-card:hover { border-color: rgba(255,255,255,0.15); }
    .summary-card .sc-label { font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.7px; font-weight: 600; }
    .summary-card .sc-val {
      font-size: 24px; font-weight: 700;
      font-family: 'Space Grotesk', sans-serif;
    }
    .sc-income  .sc-val { color: var(--income); }
    .sc-expense .sc-val { color: var(--expense); }
    .sc-balance .sc-val { color: var(--accent); }

    /* ── Calendar header row ── */
    .cal-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 18px;
    }
    .cal-month-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 22px; font-weight: 700; color: var(--text-1);
    }
    .cal-nav { display: flex; gap: 8px; }
    .btn-nav-arrow {
      width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface-3); color: var(--text-2);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 17px; transition: all var(--t);
    }
    .btn-nav-arrow:hover { background: rgba(255,255,255,0.09); color: var(--text-1); }

    /* ── Calendar grid ── */
    .cal-grid-wrap {
      background: rgba(13,21,38,0.70);
      border: 1px solid var(--border);
      border-radius: 16px; overflow: hidden;
      backdrop-filter: blur(16px);
    }

    /* Day-of-week header */
    .cal-dow-row {
      display: grid; grid-template-columns: repeat(7, 1fr);
      border-bottom: 1px solid var(--border);
    }
    .cal-dow {
      padding: 10px 0; text-align: center;
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.7px; color: var(--text-3);
    }
    .cal-dow:first-child { color: var(--expense); }   /* Sun */
    .cal-dow:last-child  { color: var(--expense); }   /* Sat */

    /* Day cells */
    .cal-days {
      display: grid; grid-template-columns: repeat(7, 1fr);
    }
    .cal-day {
      min-height: 96px; padding: 8px;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background var(--t);
      position: relative;
    }
    .cal-day:hover { background: rgba(255,255,255,0.04); }
    .cal-day:nth-child(7n) { border-right: none; }
    .cal-day.empty { cursor: default; background: rgba(0,0,0,0.2); }
    .cal-day.empty:hover { background: rgba(0,0,0,0.2); }
    .cal-day.today .day-num {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff; border-radius: 50%;
      width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 13px;
    }
    .cal-day.weekend .day-num { color: rgba(239,68,68,0.7); }
    .cal-day.today.weekend .day-num { color: #fff; }

    .day-num {
      font-size: 13px; font-weight: 500; color: var(--text-2);
      margin-bottom: 4px; width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
    }

    /* Event pills */
    .event-pills { display: flex; flex-direction: column; gap: 2px; margin-top: 2px; }
    .pill {
      font-size: 10px; font-weight: 600; padding: 2px 6px;
      border-radius: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      cursor: pointer; transition: filter var(--t);
    }
    .pill:hover { filter: brightness(1.2); }
    .pill-income  { background: var(--income-bg);  color: var(--income);  }
    .pill-expense { background: var(--expense-bg); color: var(--expense); }
    .pill-note    { background: var(--note-bg);    color: var(--note);    }

    /* More indicator */
    .more-indicator {
      font-size: 10px; color: var(--text-3); text-align: right;
      margin-top: 2px;
    }

    /* ── Modal overlay ── */
    .modal-bg {
      position: fixed; inset: 0; z-index: 500;
      background: rgba(0,0,0,0.65); backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    }
    .modal-bg.open { opacity: 1; pointer-events: all; }
    .modal {
      background: #0d1526; border: 1px solid var(--border);
      border-radius: 18px; width: 100%; max-width: 460px;
      padding: 28px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.6);
      transform: scale(0.93) translateY(16px);
      transition: transform 0.3s cubic-bezier(0.34,1.4,0.64,1), opacity 0.25s ease;
      opacity: 0;
    }
    .modal-bg.open .modal { transform: scale(1) translateY(0); opacity: 1; }

    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px;
    }
    .modal-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 18px; font-weight: 700;
    }
    .modal-close {
      width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface-3); color: var(--text-2); cursor: pointer;
      font-size: 18px; display: flex; align-items: center; justify-content: center;
      transition: all var(--t);
    }
    .modal-close:hover { background: rgba(255,255,255,0.09); color: var(--text-1); }

    /* Event list in modal */
    .event-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
    .event-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; border-radius: 10px;
      border: 1px solid transparent; background: var(--surface-3);
    }
    .event-item-income  { border-color: rgba(34,197,94,0.2);  }
    .event-item-expense { border-color: rgba(239,68,68,0.2);  }
    .event-item-note    { border-color: rgba(245,158,11,0.2); }
    .event-left { display: flex; flex-direction: column; gap: 2px; }
    .event-title-text { font-size: 14px; font-weight: 500; }
    .event-meta { font-size: 11px; color: var(--text-3); }
    .event-right { display: flex; align-items: center; gap: 8px; }
    .event-amount { font-size: 15px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; }
    .event-amount.income  { color: var(--income); }
    .event-amount.expense { color: var(--expense); }
    .event-amount.note    { color: var(--note); }
    .btn-del-event {
      width: 26px; height: 26px; border-radius: 6px; border: 1px solid rgba(239,68,68,0.25);
      background: rgba(239,68,68,0.08); color: var(--expense); cursor: pointer;
      display: flex; align-items: center; justify-content: center; font-size: 14px;
      transition: all var(--t);
    }
    .btn-del-event:hover { background: rgba(239,68,68,0.2); }

    .no-events { text-align: center; padding: 20px; color: var(--text-3); font-size: 14px; }

    /* Add event form */
    .divider-line {
      height: 1px; background: var(--border); margin: 16px 0;
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label {
      font-size: 11px; font-weight: 600; color: var(--text-3);
      text-transform: uppercase; letter-spacing: 0.7px;
    }
    .form-group input, .form-group select, .form-group textarea {
      padding: 9px 12px; background: rgba(255,255,255,0.05);
      border: 1px solid var(--border); border-radius: 8px;
      font-family: 'Inter', sans-serif; font-size: 14px; color: var(--text-1);
      outline: none; transition: border-color var(--t);
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: rgba(79,142,247,0.5);
    }
    .form-group select option { background: #0d1526; }
    .form-group textarea { resize: vertical; min-height: 60px; }

    .btn-submit {
      width: 100%; padding: 11px; margin-top: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      border: none; border-radius: 9px;
      font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 600;
      color: #fff; cursor: pointer;
      transition: all var(--t);
    }
    .btn-submit:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 28px; right: 28px; z-index: 999;
      padding: 12px 20px; border-radius: 10px;
      font-size: 13px; font-weight: 500;
      display: flex; align-items: center; gap: 8px;
      transform: translateY(80px); opacity: 0;
      transition: all 0.3s cubic-bezier(0.34,1.4,0.64,1);
    }
    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.ok   { background: rgba(34,197,94,0.15);  border: 1px solid rgba(34,197,94,0.3);  color: #86efac; }
    #toast.err  { background: rgba(239,68,68,0.15);  border: 1px solid rgba(239,68,68,0.3);  color: #fca5a5; }

    /* ── Legend ── */
    .legend {
      display: flex; gap: 16px; flex-wrap: wrap;
      justify-content: center; margin-top: 16px;
    }
    .legend-item {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--text-2);
    }
    .legend-dot {
      width: 10px; height: 10px; border-radius: 3px;
    }
    .ld-income  { background: var(--income); }
    .ld-expense { background: var(--expense); }
    .ld-note    { background: var(--note); }

    /* ── Responsive ── */
    @media (max-width: 700px) {
      main { padding: 16px; }
      .summary-row { grid-template-columns: 1fr; }
      .cal-day { min-height: 60px; padding: 5px; }
      .pill { display: none; }
      .more-indicator { display: block; font-size: 9px; }
    }
  </style>
</head>

<body>
<div id="app">

  <!-- Nav -->
  <nav>
    <a class="nav-brand" href="/app">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
        stroke="url(#navGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <defs>
          <linearGradient id="navGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#4f8ef7"/>
            <stop offset="100%" stop-color="#7c5cfc"/>
          </linearGradient>
        </defs>
        <path d="M3 3v18h18M7 16l4-4 3 3 5-5"/>
      </svg>
      FinBot
    </a>
    <div class="nav-links">
      <div class="nav-user"><div class="user-dot"></div><span id="nav-username">…</span></div>
      <button class="btn-nav btn-ghost" id="themeToggleBtn" onclick="toggleTheme()" title="Switch Theme">
        <span id="themeToggleIcon">☀️</span> <span id="themeToggleText">Day Mode</span>
      </button>
      <a class="btn-nav btn-ghost" href="/app">Dashboard</a>
      <button class="btn-nav btn-ghost" id="logout-btn" onclick="logout()">Sign Out</button>
    </div>
  </nav>

  <main>
    <!-- Summary row -->
    <div class="summary-row">
      <div class="summary-card sc-income">
        <div class="sc-label">Month Income</div>
        <div class="sc-val" id="sum-income">₹0</div>
      </div>
      <div class="summary-card sc-expense">
        <div class="sc-label">Month Expenses</div>
        <div class="sc-val" id="sum-expense">₹0</div>
      </div>
      <div class="summary-card sc-balance">
        <div class="sc-label">Net Balance</div>
        <div class="sc-val" id="sum-balance">₹0</div>
      </div>
    </div>

    <!-- Calendar header -->
    <div class="cal-header">
      <div class="cal-month-title" id="month-title">Month Year</div>
      <div class="cal-nav">
        <button class="btn-nav-arrow" id="prev-btn" onclick="changeMonth(-1)" title="Previous month">&#8249;</button>
        <button class="btn-nav-arrow" id="today-btn" onclick="goToday()" title="Today"
          style="width:auto; padding:0 12px; font-size:13px; font-family:'Inter',sans-serif; font-weight:500;">Today</button>
        <button class="btn-nav-arrow" id="next-btn" onclick="changeMonth(1)"  title="Next month">&#8250;</button>
      </div>
    </div>

    <!-- Calendar grid -->
    <div class="cal-grid-wrap">
      <div class="cal-dow-row">
        <div class="cal-dow">Sun</div>
        <div class="cal-dow">Mon</div>
        <div class="cal-dow">Tue</div>
        <div class="cal-dow">Wed</div>
        <div class="cal-dow">Thu</div>
        <div class="cal-dow">Fri</div>
        <div class="cal-dow">Sat</div>
      </div>
      <div class="cal-days" id="cal-days"></div>
    </div>

    <!-- Legend -->
    <div class="legend">
      <div class="legend-item"><div class="legend-dot ld-income"></div>Income</div>
      <div class="legend-item"><div class="legend-dot ld-expense"></div>Expense</div>
      <div class="legend-item"><div class="legend-dot ld-note"></div>Note</div>
    </div>
  </main>

</div>

<!-- ── Day Modal ── -->
<div class="modal-bg" id="modal-bg" onclick="handleModalBgClick(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-date-title">Events</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>

    <!-- Events list -->
    <div class="event-list" id="event-list">
      <div class="no-events">No events this day.</div>
    </div>

    <div class="divider-line"></div>

    <!-- Add event form -->
    <div style="font-size:13px; font-weight:600; color:var(--text-2); margin-bottom:12px; text-transform:uppercase; letter-spacing:0.6px;">Add Event</div>
    <form id="event-form" onsubmit="addEvent(event)">
      <div class="form-group" style="margin-bottom:10px;">
        <label for="ev-title">Title</label>
        <input type="text" id="ev-title" placeholder="e.g. Salary, Rent, Coffee…" required maxlength="80" />
      </div>
      <div class="form-row" style="margin-bottom:10px;">
        <div class="form-group">
          <label for="ev-type">Type</label>
          <select id="ev-type">
            <option value="income">💚 Income</option>
            <option value="expense" selected>🔴 Expense</option>
            <option value="note">📌 Note</option>
          </select>
        </div>
        <div class="form-group">
          <label for="ev-amount">Amount (₹)</label>
          <input type="number" id="ev-amount" min="0" step="0.01" placeholder="0.00" />
        </div>
      </div>
      <div class="form-group" style="margin-bottom:0;">
        <label for="ev-note">Note (optional)</label>
        <textarea id="ev-note" placeholder="Additional details…" rows="2"></textarea>
      </div>
      <button class="btn-submit" type="submit" id="ev-submit-btn">Add to Calendar</button>
    </form>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
  /* ── State ──────────────────────────────────────────────────────────────── */
  let currentYear, currentMonth;   // 0-indexed month
  let allEvents    = [];            // fetched from API
  let selectedDate = null;          // 'YYYY-MM-DD'

  const fmt = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 });

  /* ── Init ─────────────────────────────────────────────────────────────── */
  (async () => {
    // Auth check
    try {
      const r = await fetch('/api/me');
      if (!r.ok) { window.location.href = '/'; return; }
      const u = await r.json();
      document.getElementById('nav-username').textContent = u.username;
    } catch { window.location.href = '/'; return; }

    const now = new Date();
    currentYear  = now.getFullYear();
    currentMonth = now.getMonth();

    await loadEvents();
    renderCalendar();
  })();

  /* ── API ──────────────────────────────────────────────────────────────── */
  async function loadEvents() {
    const month = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}`;
    try {
      const r = await fetch(`/api/calendar?month=${month}`);
      if (r.ok) allEvents = await r.json();
    } catch { allEvents = []; }
    updateSummary();
  }

  function updateSummary() {
    let income = 0, expense = 0;
    allEvents.forEach(ev => {
      if (ev.type === 'income')  income  += ev.amount || 0;
      if (ev.type === 'expense') expense += ev.amount || 0;
    });
    document.getElementById('sum-income').textContent  = fmt.format(income);
    document.getElementById('sum-expense').textContent = fmt.format(expense);
    const bal = income - expense;
    const balEl = document.getElementById('sum-balance');
    balEl.textContent  = fmt.format(bal);
    balEl.style.color  = bal >= 0 ? 'var(--income)' : 'var(--expense)';
  }

  /* ── Calendar render ──────────────────────────────────────────────────── */
  function renderCalendar() {
    const monthNames = ['January','February','March','April','May','June',
                        'July','August','September','October','November','December'];
    document.getElementById('month-title').textContent = `${monthNames[currentMonth]} ${currentYear}`;

    const today      = new Date();
    const firstDay   = new Date(currentYear, currentMonth, 1).getDay();  // 0=Sun
    const daysInMonth= new Date(currentYear, currentMonth+1, 0).getDate();

    // Build event map: 'YYYY-MM-DD' -> [events]
    const eventMap = {};
    allEvents.forEach(ev => {
      if (!eventMap[ev.date]) eventMap[ev.date] = [];
      eventMap[ev.date].push(ev);
    });

    const container = document.getElementById('cal-days');
    container.innerHTML = '';

    // Empty cells for first week offset
    for (let i = 0; i < firstDay; i++) {
      const blank = document.createElement('div');
      blank.className = 'cal-day empty';
      container.appendChild(blank);
    }

    // Day cells
    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const cell    = document.createElement('div');
      const dow     = (firstDay + d - 1) % 7;
      const isToday = (today.getDate()===d && today.getMonth()===currentMonth && today.getFullYear()===currentYear);
      const isWeekend = (dow === 0 || dow === 6);

      cell.className = `cal-day${isToday ? ' today' : ''}${isWeekend ? ' weekend' : ''}`;
      cell.dataset.date = dateStr;
      cell.onclick = () => openModal(dateStr);

      // Day number
      const numDiv = document.createElement('div');
      numDiv.className = 'day-num';
      numDiv.textContent = d;
      cell.appendChild(numDiv);

      // Event pills
      const dayEvents = eventMap[dateStr] || [];
      const pillsDiv  = document.createElement('div');
      pillsDiv.className = 'event-pills';

      const MAX_PILLS = 2;
      dayEvents.slice(0, MAX_PILLS).forEach(ev => {
        const pill = document.createElement('div');
        pill.className = `pill pill-${ev.type}`;
        pill.textContent = ev.title;
        pillsDiv.appendChild(pill);
      });
      if (dayEvents.length > MAX_PILLS) {
        const more = document.createElement('div');
        more.className = 'more-indicator';
        more.textContent = `+${dayEvents.length - MAX_PILLS} more`;
        pillsDiv.appendChild(more);
      }
      cell.appendChild(pillsDiv);
      container.appendChild(cell);
    }
  }

  /* ── Month navigation ─────────────────────────────────────────────────── */
  async function changeMonth(delta) {
    currentMonth += delta;
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    if (currentMonth < 0)  { currentMonth = 11; currentYear--; }
    await loadEvents();
    renderCalendar();
  }

  async function goToday() {
    const now = new Date();
    currentYear  = now.getFullYear();
    currentMonth = now.getMonth();
    await loadEvents();
    renderCalendar();
  }

  /* ── Modal ────────────────────────────────────────────────────────────── */
  function openModal(dateStr) {
    selectedDate = dateStr;

    // Format readable date
    const dt = new Date(dateStr + 'T00:00:00');
    const label = dt.toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
    document.getElementById('modal-date-title').textContent = label;

    // Populate event list
    renderEventList(dateStr);

    // Show modal
    document.getElementById('modal-bg').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function renderEventList(dateStr) {
    const dayEvents = allEvents.filter(ev => ev.date === dateStr);
    const container = document.getElementById('event-list');
    container.innerHTML = '';

    if (!dayEvents.length) {
      container.innerHTML = '<div class="no-events">No events for this day. Add one below!</div>';
      return;
    }

    dayEvents.forEach(ev => {
      const item = document.createElement('div');
      item.className = `event-item event-item-${ev.type}`;
      const amtHtml = ev.amount > 0
        ? `<div class="event-amount ${ev.type}">${ev.type==='expense'?'-':'+'} ${fmt.format(ev.amount)}</div>`
        : '';
      item.innerHTML = `
        <div class="event-left">
          <div class="event-title-text">${escHtml(ev.title)}</div>
          ${ev.note ? `<div class="event-meta">${escHtml(ev.note)}</div>` : ''}
        </div>
        <div class="event-right">
          ${amtHtml}
          <button class="btn-del-event" onclick="deleteEvent('${ev.id}')" title="Delete">×</button>
        </div>
      `;
      container.appendChild(item);
    });
  }

  function closeModal() {
    document.getElementById('modal-bg').classList.remove('open');
    document.body.style.overflow = '';
    selectedDate = null;
    document.getElementById('event-form').reset();
  }

  function handleModalBgClick(e) {
    if (e.target === document.getElementById('modal-bg')) closeModal();
  }

  /* ── Add event ────────────────────────────────────────────────────────── */
  async function addEvent(e) {
    e.preventDefault();
    if (!selectedDate) return;

    const btn = document.getElementById('ev-submit-btn');
    btn.disabled = true; btn.textContent = 'Adding…';

    const payload = {
      title:  document.getElementById('ev-title').value.trim(),
      type:   document.getElementById('ev-type').value,
      amount: parseFloat(document.getElementById('ev-amount').value) || 0,
      note:   document.getElementById('ev-note').value.trim(),
      date:   selectedDate,
    };

    try {
      const r = await fetch('/api/calendar', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(payload)
      });
      const data = await r.json();
      if (r.ok) {
        allEvents.push(data);
        updateSummary();
        renderCalendar();
        renderEventList(selectedDate);
        document.getElementById('event-form').reset();
        showToast('Event added!', 'ok');
      } else {
        showToast(data.error || 'Failed to add event', 'err');
      }
    } catch {
      showToast('Network error', 'err');
    }

    btn.disabled = false; btn.textContent = 'Add to Calendar';
  }

  /* ── Delete event ─────────────────────────────────────────────────────── */
  async function deleteEvent(id) {
    if (!confirm('Delete this event?')) return;
    try {
      const r = await fetch(`/api/calendar/${id}`, { method:'DELETE' });
      if (r.ok) {
        allEvents = allEvents.filter(ev => ev.id !== id);
        updateSummary();
        renderCalendar();
        if (selectedDate) renderEventList(selectedDate);
        showToast('Event deleted', 'ok');
      } else {
        showToast('Could not delete event', 'err');
      }
    } catch { showToast('Network error', 'err'); }
  }

  /* ── Logout ───────────────────────────────────────────────────────────── */
  async function logout() {
    await fetch('/api/logout', { method:'POST' });
    window.location.href = '/';
  }

  /* ── Toast ────────────────────────────────────────────────────────────── */
  let toastTimer;
  function showToast(msg, type) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className   = `show ${type}`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = ''; }, 3000);
  }

  /* ── Theme Manager ────────────────────────────────────────────────────── */
  function updateThemeUI() {
    const isLight = document.documentElement.classList.contains('light-mode');
    const btnIcon = document.getElementById('themeToggleIcon');
    const btnText = document.getElementById('themeToggleText');
    const btn = document.getElementById('themeToggleBtn');

    if (btnIcon && btnText) {
      if (isLight) {
        btnIcon.textContent = '🌙';
        btnText.textContent = 'Dark Mode';
        if (btn) btn.title = 'Switch to Dark Mode';
      } else {
        btnIcon.textContent = '☀️';
        btnText.textContent = 'Day Mode';
        if (btn) btn.title = 'Switch to Day Mode';
      }
    }
  }

  function toggleTheme() {
    const isLight = document.documentElement.classList.toggle('light-mode');
    localStorage.setItem('finbot_theme', isLight ? 'light' : 'dark');
    updateThemeUI();
  }

  document.addEventListener('DOMContentLoaded', () => {
    updateThemeUI();
  });

  /* ── Utils ────────────────────────────────────────────────────────────── */
  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
              .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
</script>
</body>
</html>
