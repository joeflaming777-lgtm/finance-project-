<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FinBot – Financial Calendar | Track Every Rupee</title>
  <meta name="description" content="Your personal financial calendar. Track income and expenses day by day with FinBot." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script>
    (function() {
      if (localStorage.getItem('finbot_theme') === 'light') {
        document.documentElement.classList.add('light-mode');
      }
    })();
  </script>

  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Design Tokens ── */
    :root {
      --brand:       #1a56db;
      --brand-dim:   rgba(26,86,219,0.10);
      --green:       #0e9f6e;
      --green-dim:   rgba(14,159,110,0.12);
      --red:         #e02424;
      --red-dim:     rgba(224,36,36,0.10);
      --amber:       #b45309;
      --amber-dim:   rgba(180,83,9,0.12);
      --income:      #0e9f6e;
      --income-bg:   rgba(14,159,110,0.12);
      --expense:     #e02424;
      --expense-bg:  rgba(224,36,36,0.10);
      --note:        #b45309;
      --note-bg:     rgba(180,83,9,0.12);
      --bg:          #0d1117;
      --bg-panel:    #111827;
      --surface:     #1f2937;
      --surface-2:   #374151;
      --surface-3:   rgba(255,255,255,0.03);
      --border:      rgba(255,255,255,0.08);
      --border-2:    rgba(255,255,255,0.13);
      --text-1:      #f9fafb;
      --text-2:      #9ca3af;
      --text-3:      #6b7280;
      --font-head:   'Plus Jakarta Sans', sans-serif;
      --font-body:   'Inter', sans-serif;
      --font-mono:   'JetBrains Mono', monospace;
      --radius-sm:   6px;
      --radius:      10px;
      --radius-lg:   14px;
      --t:           0.18s cubic-bezier(0.4,0,0.2,1);
      --shadow:      0 1px 3px rgba(0,0,0,0.25), 0 4px 12px rgba(0,0,0,0.20);
    }

    html.light-mode {
      --bg:          #f1f5f9;
      --bg-panel:    #ffffff;
      --surface:     #f8fafc;
      --surface-2:   #e2e8f0;
      --surface-3:   rgba(0,0,0,0.02);
      --border:      #e2e8f0;
      --border-2:    #cbd5e1;
      --text-1:      #111827;
      --text-2:      #374151;
      --text-3:      #6b7280;
      --income:      #0e9f6e;
      --expense:     #c81e1e;
      --note:        #92400e;
    }

    html, body {
      height: 100%;
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text-1);
    }

    /* ── App Shell ── */
    #app {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 0;
      flex-shrink: 0;
      position: sticky;
      top: 0; z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      text-decoration: none;
      margin-right: 24px;
      flex-shrink: 0;
    }
    .brand-icon {
      width: 32px; height: 32px;
      background: var(--brand);
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
    }
    .brand-icon svg { width: 16px; height: 16px; stroke: #fff; }
    .brand-name {
      font-family: var(--font-head);
      font-size: 17px; font-weight: 700;
      color: var(--text-1);
      letter-spacing: -0.2px;
    }

    .header-spacer { flex: 1; }

    .header-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-user {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-2);
      padding: 5px 12px;
      background: var(--surface-3);
      border: 1px solid var(--border);
      border-radius: 20px;
      display: flex; align-items: center; gap: 6px;
    }
    .user-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
    }

    .btn-nav {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-3);
      font-family: var(--font-body);
      font-size: 12.5px; font-weight: 500;
      color: var(--text-2);
      cursor: pointer;
      text-decoration: none;
      transition: all var(--t);
    }
    .btn-nav:hover {
      border-color: var(--border-2);
      color: var(--text-1);
      background: var(--surface);
    }
    .btn-nav svg { width: 13px; height: 13px; }

    /* ── MAIN ── */
    main {
      flex: 1;
      padding: 24px;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    /* ── Page header ── */
    .page-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .page-title {
      font-family: var(--font-head);
      font-size: 22px; font-weight: 700;
      color: var(--text-1);
      letter-spacing: -0.3px;
    }
    .page-subtitle {
      font-size: 13px;
      color: var(--text-3);
      margin-top: 2px;
    }

    /* ── Summary Cards ── */
    .summary-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }
    .summary-card {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: border-color var(--t);
    }
    .summary-card:hover { border-color: var(--border-2); }
    html.light-mode .summary-card { background: #ffffff; box-shadow: var(--shadow); }

    .sc-label {
      font-size: 10.5px; font-weight: 600;
      color: var(--text-3);
      text-transform: uppercase; letter-spacing: 0.55px;
    }
    .sc-val {
      font-family: var(--font-head);
      font-size: 24px; font-weight: 700;
      color: var(--text-1);
      line-height: 1;
    }
    .sc-income  .sc-val { color: var(--income); }
    .sc-expense .sc-val { color: var(--expense); }

    /* ── Calendar wrapper: 2 columns ── */
    .cal-layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 16px;
      align-items: start;
    }

    /* ── Calendar panel ── */
    .cal-panel {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    html.light-mode .cal-panel {
      background: #ffffff;
      box-shadow: var(--shadow);
    }

    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
    }

    .cal-month-title {
      font-family: var(--font-head);
      font-size: 17px; font-weight: 700;
      color: var(--text-1);
    }

    .cal-nav { display: flex; align-items: center; gap: 6px; }

    .btn-arrow {
      width: 32px; height: 32px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-3);
      color: var(--text-2);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 16px;
      transition: all var(--t);
    }
    .btn-arrow:hover { border-color: var(--border-2); color: var(--text-1); }

    .btn-today {
      height: 32px;
      padding: 0 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-3);
      font-family: var(--font-body);
      font-size: 12px; font-weight: 500;
      color: var(--text-2);
      cursor: pointer;
      transition: all var(--t);
    }
    .btn-today:hover { border-color: var(--border-2); color: var(--text-1); }

    /* Day-of-week header */
    .cal-dow-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      border-bottom: 1px solid var(--border);
    }
    .cal-dow {
      padding: 9px 0;
      text-align: center;
      font-size: 10px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.5px;
      color: var(--text-3);
    }
    .cal-dow:first-child, .cal-dow:last-child { color: var(--expense); opacity: 0.6; }

    /* Day cells */
    .cal-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }

    .cal-day {
      min-height: 88px;
      padding: 7px;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background var(--t);
      position: relative;
    }
    .cal-day:hover { background: var(--surface-3); }
    .cal-day:nth-child(7n) { border-right: none; }
    .cal-day.empty { cursor: default; background: rgba(0,0,0,0.15); }
    html.light-mode .cal-day.empty { background: #f8fafc; }
    .cal-day.empty:hover { background: rgba(0,0,0,0.15); }
    html.light-mode .cal-day.empty:hover { background: #f8fafc; }

    /* Selected day highlight */
    .cal-day.selected {
      background: var(--brand-dim);
    }
    .cal-day.selected:hover { background: rgba(26,86,219,0.14); }

    /* Today */
    .cal-day.today .day-num {
      background: var(--brand);
      color: #fff;
      border-radius: 50%;
      width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 12px;
    }
    .cal-day.weekend .day-num { color: rgba(224,36,36,0.6); }
    .cal-day.today.weekend .day-num { color: #fff; }

    .day-num {
      font-size: 12px; font-weight: 500;
      color: var(--text-2);
      width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 3px;
    }

    /* Event pills */
    .event-pills { display: flex; flex-direction: column; gap: 2px; margin-top: 1px; }
    .pill {
      font-size: 9.5px; font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      cursor: pointer; transition: filter var(--t);
    }
    .pill:hover { filter: brightness(1.15); }
    .pill-income  { background: var(--income-bg);  color: var(--income);  }
    .pill-expense { background: var(--expense-bg); color: var(--expense); }
    .pill-note    { background: var(--note-bg);    color: var(--note);    }

    .more-indicator {
      font-size: 9px; color: var(--text-3);
      text-align: right; margin-top: 2px;
    }

    /* ── SIDE PANEL ── */
    .side-panel {
      background: var(--bg-panel);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
      position: sticky;
      top: 80px;
    }
    html.light-mode .side-panel {
      background: #ffffff;
      box-shadow: var(--shadow);
    }

    .side-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .side-date-title {
      font-family: var(--font-head);
      font-size: 14px; font-weight: 700;
      color: var(--text-1);
    }
    .side-hint {
      font-size: 11.5px;
      color: var(--text-3);
      margin-top: 2px;
    }

    /* Event list in side panel */
    .event-list {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 260px;
      overflow-y: auto;
      scrollbar-width: thin;
    }
    .event-list:empty::after {
      content: 'No events for this day.';
      display: block;
      text-align: center;
      color: var(--text-3);
      font-size: 12px;
      padding: 16px 0;
    }

    .event-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      background: var(--surface-3);
    }
    .event-item-income  { border-color: rgba(14,159,110,0.15); }
    .event-item-expense { border-color: rgba(224,36,36,0.15); }
    .event-item-note    { border-color: rgba(180,83,9,0.15); }
    .event-left { display: flex; flex-direction: column; gap: 1px; flex: 1; min-width: 0; }
    .event-title-text { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .event-meta { font-size: 10px; color: var(--text-3); }
    .event-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; margin-left: 8px; }
    .event-amount { font-family: var(--font-head); font-size: 13px; font-weight: 700; }
    .event-amount.income  { color: var(--income); }
    .event-amount.expense { color: var(--expense); }
    .event-amount.note    { color: var(--note); }
    .btn-del-event {
      width: 24px; height: 24px;
      border-radius: var(--radius-sm);
      border: 1px solid rgba(224,36,36,0.20);
      background: rgba(224,36,36,0.06);
      color: var(--expense);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px;
      transition: all var(--t);
    }
    .btn-del-event:hover { background: rgba(224,36,36,0.18); }
    .no-events {
      text-align: center; padding: 16px; color: var(--text-3); font-size: 12.5px;
    }

    /* Add event form */
    .add-event-section {
      padding: 12px 14px;
      border-top: 1px solid var(--border);
    }
    .add-event-label {
      font-size: 10px; font-weight: 700;
      color: var(--text-3);
      text-transform: uppercase; letter-spacing: 0.6px;
      margin-bottom: 10px;
    }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label {
      font-size: 10px; font-weight: 600;
      color: var(--text-3);
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      padding: 8px 10px;
      background: var(--surface-3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: 13px;
      color: var(--text-1);
      outline: none;
      transition: border-color var(--t);
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: rgba(26,86,219,0.40);
    }
    .form-group select option { background: var(--bg-panel); }
    .form-group textarea { resize: vertical; min-height: 52px; }
    html.light-mode .form-group input,
    html.light-mode .form-group select,
    html.light-mode .form-group textarea {
      background: #f8fafc;
      border-color: #d1d5db;
      color: #111827;
    }

    .btn-submit {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      background: var(--brand);
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font-head);
      font-size: 13px; font-weight: 600;
      color: #fff;
      cursor: pointer;
      transition: background var(--t), transform var(--t);
    }
    .btn-submit:hover { background: #1648c0; transform: translateY(-1px); }
    .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* ── Legend ── */
    .legend {
      display: flex; gap: 14px;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    .legend-item {
      display: flex; align-items: center; gap: 5px;
      font-size: 11.5px; color: var(--text-2);
    }
    .legend-dot {
      width: 8px; height: 8px; border-radius: 3px;
    }
    .ld-income  { background: var(--income); }
    .ld-expense { background: var(--expense); }
    .ld-note    { background: var(--note); }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 999;
      padding: 10px 16px; border-radius: var(--radius);
      font-size: 13px; font-weight: 500;
      display: flex; align-items: center; gap: 8px;
      transform: translateY(80px); opacity: 0;
      transition: all 0.3s cubic-bezier(0.34,1.4,0.64,1);
      box-shadow: var(--shadow);
    }
    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.ok   {
      background: var(--bg-panel);
      border: 1px solid rgba(14,159,110,0.25);
      color: var(--income);
    }
    #toast.err  {
      background: var(--bg-panel);
      border: 1px solid rgba(224,36,36,0.25);
      color: var(--expense);
    }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .cal-layout { grid-template-columns: 1fr; }
      .side-panel { position: static; }
    }
    @media (max-width: 640px) {
      main { padding: 14px; }
      .summary-row { grid-template-columns: 1fr; }
      .cal-day { min-height: 58px; padding: 4px; }
      .pill { display: none; }
    }
  </style>
</head>

<body>
<div id="app">

  <!-- ── HEADER ── -->
  <header>
    <a class="brand" href="/app">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3v18h18M7 16l4-4 3 3 5-5"/>
        </svg>
      </div>
      <span class="brand-name">FinBot</span>
    </a>

    <div class="header-spacer"></div>

    <div class="header-nav">
      <div class="nav-user">
        <span class="user-dot"></span>
        <span id="nav-username">…</span>
      </div>
      <button class="btn-nav" id="themeToggleBtn" onclick="toggleTheme()" title="Switch Theme">
        <span id="themeToggleIcon">☀️</span>
        <span id="themeToggleText">Day Mode</span>
      </button>
      <a class="btn-nav" href="/app">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3v18h18M7 16l4-4 3 3 5-5"/>
        </svg>
        Dashboard
      </a>
      <button class="btn-nav" id="logout-btn" onclick="logout()">Sign Out</button>
    </div>
  </header>

  <!-- ── MAIN ── -->
  <main>

    <!-- Page header -->
    <div class="page-header">
      <div>
        <h1 class="page-title">Financial Calendar</h1>
        <p class="page-subtitle">Click any day to log income, expenses, or notes</p>
      </div>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot ld-income"></div>Income</div>
        <div class="legend-item"><div class="legend-dot ld-expense"></div>Expense</div>
        <div class="legend-item"><div class="legend-dot ld-note"></div>Note</div>
      </div>
    </div>

    <!-- Summary -->
    <div class="summary-row">
      <div class="summary-card sc-income">
        <div class="sc-label">Month Income</div>
        <div class="sc-val" id="sum-income">₹0</div>
      </div>
      <div class="summary-card sc-expense">
        <div class="sc-label">Month Expenses</div>
        <div class="sc-val" id="sum-expense">₹0</div>
      </div>
      <div class="summary-card">
        <div class="sc-label">Net Balance</div>
        <div class="sc-val" id="sum-balance">₹0</div>
      </div>
    </div>

    <!-- Calendar + Side Panel -->
    <div class="cal-layout">

      <!-- Calendar -->
      <div class="cal-panel">
        <div class="cal-header">
          <div class="cal-month-title" id="month-title">Month Year</div>
          <div class="cal-nav">
            <button class="btn-arrow" id="prev-btn" onclick="changeMonth(-1)" title="Previous month">‹</button>
            <button class="btn-today" id="today-btn" onclick="goToday()" title="Today">Today</button>
            <button class="btn-arrow" id="next-btn" onclick="changeMonth(1)"  title="Next month">›</button>
          </div>
        </div>
        <div class="cal-dow-row">
          <div class="cal-dow">Sun</div>
          <div class="cal-dow">Mon</div>
          <div class="cal-dow">Tue</div>
          <div class="cal-dow">Wed</div>
          <div class="cal-dow">Thu</div>
          <div class="cal-dow">Fri</div>
          <div class="cal-dow">Sat</div>
        </div>
        <div class="cal-days" id="cal-days"></div>
      </div>

      <!-- Side Panel -->
      <div class="side-panel" id="side-panel">
        <div class="side-header">
          <div class="side-date-title" id="side-date-title">Select a day</div>
          <div class="side-hint">Click a calendar day to view or add events</div>
        </div>

        <!-- Events list -->
        <div class="event-list" id="event-list">
          <div class="no-events">Select a day to see events.</div>
        </div>

        <!-- Add Event Form -->
        <div class="add-event-section">
          <div class="add-event-label">Add Event</div>
          <form id="event-form" onsubmit="addEvent(event)">
            <div class="form-group" style="margin-bottom:8px;">
              <label for="ev-title">Title</label>
              <input type="text" id="ev-title" placeholder="e.g. Salary, Rent, Coffee…" required maxlength="80" />
            </div>
            <div class="form-row">
              <div class="form-group">
                <label for="ev-type">Type</label>
                <select id="ev-type">
                  <option value="income">Income</option>
                  <option value="expense" selected>Expense</option>
                  <option value="note">Note</option>
                </select>
              </div>
              <div class="form-group">
                <label for="ev-amount">Amount (₹)</label>
                <input type="number" id="ev-amount" min="0" step="0.01" placeholder="0.00" />
              </div>
            </div>
            <div class="form-group" style="margin-bottom:0;">
              <label for="ev-note">Note (optional)</label>
              <textarea id="ev-note" placeholder="Additional details…" rows="2"></textarea>
            </div>
            <button class="btn-submit" type="submit" id="ev-submit-btn">Add to Calendar</button>
          </form>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
  /* ── State ── */
  let currentYear, currentMonth;
  let allEvents    = [];
  let selectedDate = null;

  const fmt = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 });

  /* ── Init ── */
  (async () => {
    try {
      const r = await fetch('/api/me');
      if (!r.ok) { window.location.href = '/'; return; }
      const u = await r.json();
      document.getElementById('nav-username').textContent = u.username;
    } catch { window.location.href = '/'; return; }

    const now = new Date();
    currentYear  = now.getFullYear();
    currentMonth = now.getMonth();

    await loadEvents();
    renderCalendar();
  })();

  /* ── API ── */
  async function loadEvents() {
    const month = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}`;
    try {
      const r = await fetch(`/api/calendar?month=${month}`);
      if (r.ok) allEvents = await r.json();
    } catch { allEvents = []; }
    updateSummary();
  }

  function updateSummary() {
    let income = 0, expense = 0;
    allEvents.forEach(ev => {
      if (ev.type === 'income')  income  += ev.amount || 0;
      if (ev.type === 'expense') expense += ev.amount || 0;
    });
    document.getElementById('sum-income').textContent  = fmt.format(income);
    document.getElementById('sum-expense').textContent = fmt.format(expense);
    const bal = income - expense;
    const balEl = document.getElementById('sum-balance');
    balEl.textContent  = fmt.format(bal);
    balEl.style.color  = bal >= 0 ? 'var(--income)' : 'var(--expense)';
  }

  /* ── Calendar render ── */
  function renderCalendar() {
    const monthNames = ['January','February','March','April','May','June',
                        'July','August','September','October','November','December'];
    document.getElementById('month-title').textContent = `${monthNames[currentMonth]} ${currentYear}`;

    const today      = new Date();
    const firstDay   = new Date(currentYear, currentMonth, 1).getDay();
    const daysInMonth= new Date(currentYear, currentMonth+1, 0).getDate();

    const eventMap = {};
    allEvents.forEach(ev => {
      if (!eventMap[ev.date]) eventMap[ev.date] = [];
      eventMap[ev.date].push(ev);
    });

    const container = document.getElementById('cal-days');
    container.innerHTML = '';

    for (let i = 0; i < firstDay; i++) {
      const blank = document.createElement('div');
      blank.className = 'cal-day empty';
      container.appendChild(blank);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const cell    = document.createElement('div');
      const dow     = (firstDay + d - 1) % 7;
      const isToday = (today.getDate()===d && today.getMonth()===currentMonth && today.getFullYear()===currentYear);
      const isWeekend = (dow === 0 || dow === 6);
      const isSelected = (dateStr === selectedDate);

      cell.className = `cal-day${isToday ? ' today' : ''}${isWeekend ? ' weekend' : ''}${isSelected ? ' selected' : ''}`;
      cell.dataset.date = dateStr;
      cell.onclick = () => selectDate(dateStr);

      const numDiv = document.createElement('div');
      numDiv.className = 'day-num';
      numDiv.textContent = d;
      cell.appendChild(numDiv);

      const dayEvents = eventMap[dateStr] || [];
      const pillsDiv  = document.createElement('div');
      pillsDiv.className = 'event-pills';

      const MAX_PILLS = 2;
      dayEvents.slice(0, MAX_PILLS).forEach(ev => {
        const pill = document.createElement('div');
        pill.className = `pill pill-${ev.type}`;
        pill.textContent = ev.title;
        pillsDiv.appendChild(pill);
      });
      if (dayEvents.length > MAX_PILLS) {
        const more = document.createElement('div');
        more.className = 'more-indicator';
        more.textContent = `+${dayEvents.length - MAX_PILLS} more`;
        pillsDiv.appendChild(more);
      }
      cell.appendChild(pillsDiv);
      container.appendChild(cell);
    }
  }

  /* ── Date selection ── */
  function selectDate(dateStr) {
    selectedDate = dateStr;

    // Update side panel header
    const dt = new Date(dateStr + 'T00:00:00');
    const label = dt.toLocaleDateString('en-IN', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
    document.getElementById('side-date-title').textContent = label;
    document.getElementById('side-panel').querySelector('.side-hint').style.display = 'none';

    // Render events
    renderEventList(dateStr);

    // Re-render calendar to show selection
    renderCalendar();
  }

  function renderEventList(dateStr) {
    const dayEvents = allEvents.filter(ev => ev.date === dateStr);
    const container = document.getElementById('event-list');
    container.innerHTML = '';

    if (!dayEvents.length) {
      container.innerHTML = '<div class="no-events">No events for this day. Add one below!</div>';
      return;
    }

    dayEvents.forEach(ev => {
      const item = document.createElement('div');
      item.className = `event-item event-item-${ev.type}`;
      const amtHtml = ev.amount > 0
        ? `<div class="event-amount ${ev.type}">${ev.type==='expense'?'-':'+'} ${fmt.format(ev.amount)}</div>`
        : '';
      item.innerHTML = `
        <div class="event-left">
          <div class="event-title-text">${escHtml(ev.title)}</div>
          ${ev.note ? `<div class="event-meta">${escHtml(ev.note)}</div>` : ''}
        </div>
        <div class="event-right">
          ${amtHtml}
          <button class="btn-del-event" onclick="deleteEvent('${ev.id}')" title="Delete">×</button>
        </div>
      `;
      container.appendChild(item);
    });
  }

  /* ── Month navigation ── */
  async function changeMonth(delta) {
    currentMonth += delta;
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    if (currentMonth < 0)  { currentMonth = 11; currentYear--; }
    selectedDate = null;
    await loadEvents();
    renderCalendar();
    document.getElementById('side-date-title').textContent = 'Select a day';
    document.getElementById('event-list').innerHTML = '<div class="no-events">Select a day to see events.</div>';
    document.getElementById('side-panel').querySelector('.side-hint').style.display = '';
  }

  async function goToday() {
    const now = new Date();
    currentYear  = now.getFullYear();
    currentMonth = now.getMonth();
    await loadEvents();
    renderCalendar();
  }

  /* ── Add event ── */
  async function addEvent(e) {
    e.preventDefault();
    if (!selectedDate) { showToast('Please select a day on the calendar first.', 'err'); return; }

    const btn = document.getElementById('ev-submit-btn');
    btn.disabled = true; btn.textContent = 'Adding…';

    const payload = {
      title:  document.getElementById('ev-title').value.trim(),
      type:   document.getElementById('ev-type').value,
      amount: parseFloat(document.getElementById('ev-amount').value) || 0,
      note:   document.getElementById('ev-note').value.trim(),
      date:   selectedDate,
    };

    try {
      const r = await fetch('/api/calendar', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(payload)
      });
      const data = await r.json();
      if (r.ok) {
        allEvents.push(data);
        updateSummary();
        renderCalendar();
        renderEventList(selectedDate);
        document.getElementById('event-form').reset();
        showToast('Event added!', 'ok');
      } else {
        showToast(data.error || 'Failed to add event', 'err');
      }
    } catch { showToast('Network error', 'err'); }

    btn.disabled = false; btn.textContent = 'Add to Calendar';
  }

  /* ── Delete event ── */
  async function deleteEvent(id) {
    if (!confirm('Delete this event?')) return;
    try {
      const r = await fetch(`/api/calendar/${id}`, { method:'DELETE' });
      if (r.ok) {
        allEvents = allEvents.filter(ev => ev.id !== id);
        updateSummary();
        renderCalendar();
        if (selectedDate) renderEventList(selectedDate);
        showToast('Event deleted', 'ok');
      } else { showToast('Could not delete event', 'err'); }
    } catch { showToast('Network error', 'err'); }
  }

  /* ── Logout ── */
  async function logout() {
    await fetch('/api/logout', { method:'POST' });
    window.location.href = '/';
  }

  /* ── Toast ── */
  let toastTimer;
  function showToast(msg, type) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className   = `show ${type || 'ok'}`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = ''; }, 3200);
  }

  /* ── Theme ── */
  function updateThemeUI() {
    const isLight = document.documentElement.classList.contains('light-mode');
    const btnIcon = document.getElementById('themeToggleIcon');
    const btnText = document.getElementById('themeToggleText');
    if (btnIcon && btnText) {
      btnIcon.textContent = isLight ? '🌙' : '☀️';
      btnText.textContent = isLight ? 'Dark Mode' : 'Day Mode';
    }
  }

  function toggleTheme() {
    const isLight = document.documentElement.classList.toggle('light-mode');
    localStorage.setItem('finbot_theme', isLight ? 'light' : 'dark');
    updateThemeUI();
  }

  document.addEventListener('DOMContentLoaded', () => { updateThemeUI(); });

  /* ── Utils ── */
  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
              .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  }
</script>
</body>
</html>
